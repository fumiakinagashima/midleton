name = "midleton"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = ".svelte-kit/cloudflare/_worker.js"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "midleton"
database_id = "06f71c5e-2de6-4db4-b951-64705293e69a"
migrations_dir = "drizzle"

# KV: wrangler kv namespace create midleton を実行後、id を設定してコメントを外す
# [[kv_namespaces]]
# binding = "KV"
# id = ""

# R2: wrangler r2 bucket create midleton を実行後にコメントを外す
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "midleton"

[vars]
# 本番は `wrangler secret put ANTHROPIC_API_KEY` で管理する
ANTHROPIC_API_KEY = ""
# ローカル開発時のモックモード（.dev.vars で上書き可能）
MOCK_AI = "false"
