name = "midleton"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

# Reminder delivery: checks pending reminders every minute and sends the ones that have reached remind_at
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "midleton"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID" # `wrangler d1 create midleton`
migrations_dir = "drizzle"

# KV: before deploying to production, run `wrangler kv namespace create midleton`
# and replace the id below with the output (local dev can keep a dummy value; a local KV store is created under .wrangler/state)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# R2: before deploying to production, run `wrangler r2 bucket create midleton`
[[r2_buckets]]
binding = "R2"
bucket_name = "midleton"

[vars]
# ANTHROPIC_API_KEY is managed via `wrangler secret put ANTHROPIC_API_KEY` (not defined here, since a value in [vars] would overwrite the secret with an empty string on deploy)
# Mock mode for local development (can be overridden via .dev.vars)
MOCK_AI = "false"
